<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sharma Electric & HVAC · Office TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #0b1530;
      --panel: #1a2f61;
      --gold: #F0A846;
      --gold-dim: rgba(240, 168, 70, 0.45);
      --gold-soft: rgba(240, 168, 70, 0.18);
      --white: #ffffff;
      --mute: rgba(255, 255, 255, 0.62);
      --safe-x: 96px;
      --safe-y: 54px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: var(--white);
      font-family: Inter, sans-serif;
      font-size: 28px;
      line-height: 1.25;
      -webkit-font-smoothing: antialiased;
      background: var(--void);
    }
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, #1a2f61 0%, #102044 42%, #0b1530 78%);
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(240, 168, 70, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240, 168, 70, 0.045) 1px, transparent 1px);
      background-size: 56px 56px;
    }
    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.04) 0,
        rgba(255, 255, 255, 0.04) 1px,
        transparent 1px,
        transparent 4px
      );
      -webkit-animation: scan 12s linear infinite;
      animation: scan 12s linear infinite;
    }
    @-webkit-keyframes scan { from { background-position: 0 0; } to { background-position: 0 56px; } }
    @keyframes scan { from { background-position: 0 0; } to { background-position: 0 56px; } }

    .stage::before, .stage::after { z-index: 2; }
    .wm {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
    }
    .wm img {
      width: 74%;
      max-width: 1360px;
      height: auto;
      opacity: 0.16;
    }
    .board {
      position: absolute;
      top: 0; left: 0;
      width: 1920px;
      height: 1080px;
      padding: var(--safe-y) var(--safe-x);
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 1;
      transform-origin: top left;
    }

    .hdr {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) max-content;
      align-items: center;
      gap: 20px;
      min-height: 118px;
    }
    .hdr-clock {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 4px;
      min-width: 0;
    }
    .hdr-clock .clock { font-size: 64px; }
    .hdr-date { display: flex; flex-direction: row; align-items: baseline; gap: 16px; }
    .hdr-date .dow { margin-top: 0; }
    .hdr-wx {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      min-width: 0;
      overflow: hidden;
    }
    .hdr-wx .temp { font-size: 64px; flex: 0 0 auto; }
    .hdr-wx .wx-copy { min-width: 0; overflow: hidden; }
    .hdr-wx .wx-copy .loc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hdr-wx .wx-rain {
      font-family: "IBM Plex Mono", monospace;
      font-size: 22px;
      font-weight: 500;
      color: var(--mute);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand { display: flex; align-items: center; gap: 18px; }
    .logo-chip {
      background: #fff;
      border: 2px solid var(--gold);
      border-radius: 4px;
      padding: 8px 14px;
      height: 118px;
      display: flex;
      align-items: center;
      box-shadow: 0 0 16px rgba(240, 168, 70, 0.28);
    }
    .logo-chip img { height: 100px; width: auto; display: block; }
    .brand-meta { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
    .brand-meta .lock-title {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--white);
      line-height: 1;
      text-shadow: 0 0 16px rgba(240, 168, 70, 0.25);
    }
    .brand-meta .lock-sub {
      font-family: "IBM Plex Mono", monospace;
      font-size: 20px;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      line-height: 1;
    }
    .kicker {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 0;
      line-height: 1;
    }
    .brand-meta .kicker { font-size: 28px; color: var(--white); letter-spacing: 0.16em; }
    .brand-meta .sub {
      font-family: "IBM Plex Mono", monospace;
      font-size: 24px;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .hdr-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      font-family: "IBM Plex Mono", monospace;
      flex: 0 0 auto;
      min-width: max-content;
    }
    .hdr-right .ops, .hdr-right .updated { line-height: 1.1; }
    .ops {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 14px rgba(240, 168, 70, 0.45);
    }
    .ops .sep { color: var(--mute); padding: 0 6px; }
    .ops.stale { color: var(--gold); }
    .updated {
      font-size: 28px;
      font-weight: 500;
      color: var(--white);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .flag-stale {
      display: none;
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 5px 12px 6px;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 0 12px rgba(240, 168, 70, 0.55);
      background: rgba(11, 21, 48, 0.65);
    }
    .flag-stale.on { display: inline-block; }

    .main {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 430px 1fr 460px;
      gap: 16px;
    }
    .main.targets-2 {
      grid-template-columns: 410px 1fr 1fr 460px;
      gap: 14px;
    }
    .main.targets-many { grid-template-columns: 430px 1.35fr 420px; }

    .owner {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 18px 20px 16px;
    }
    .owner .panel-head { margin-bottom: 12px; flex: 0 0 auto; }
    .owner-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .own-day {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 10px 0 2px;
      flex: 0 0 auto;
    }
    .own-day:first-child { margin-top: 0; }
    .own-item {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      column-gap: 16px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(240, 168, 70, 0.12);
      flex: 0 0 auto;
    }
    .own-item:last-child { border-bottom: 0; }
    .own-item .tm {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 28px;
      color: var(--gold);
      letter-spacing: 0.04em;
      line-height: 1.2;
      white-space: nowrap;
    }
    .own-item .ttl {
      font-size: 28px;
      font-weight: 600;
      line-height: 1.2;
      min-width: 0;
    }
    .own-item .meta {
      grid-column: 1 / -1;
      font-family: "IBM Plex Mono", monospace;
      font-size: 24px;
      font-weight: 500;
      color: var(--mute);
      line-height: 1.25;
      margin-top: 2px;
      min-width: 0;
    }
    .own-item.compact { padding: 6px 0; grid-template-columns: max-content minmax(0, 1fr); column-gap: 16px; }
    .own-item.compact .tm { font-size: 24px; }
    .own-item.compact .ttl { font-size: 24px; }
    .own-item.compact .meta { font-size: 22px; }
    .owner .awaiting {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
      line-height: 1.25;
      margin: auto 0;
      padding: 12px 0;
    }
    .owner .awaiting div { letter-spacing: 0.08em; }
    .targets { display: flex; min-width: 0; min-height: 0; }
    .main.targets-1 .targets,
    .main.targets-0 .targets { flex-direction: column; }
    .main.targets-2 .targets { display: contents; }
    .main.targets-many .targets {
      flex-direction: column;
      gap: 12px;
    }
    /* Fix: with 3+ targets the main card overflowed upward into the header (2026-11-17) */
    .main.targets-many .targets > .target:not(.target-mini) { justify-content: flex-start; min-height: 0; }
    .main.targets-many .targets > .target:not(.target-mini) .target-name { font-size: 46px; margin: 10px 0 6px; }
    .main.targets-many .ring-wrap { width: 112px; height: 112px; margin-top: 2px; }
    .main.targets-many .ring-core .days { font-size: 38px; }
    .main.targets-many .ring-core .unit { font-size: 18px; }
    .main.targets-many .ring-core .unit-sub { font-size: 13px; }
    .mini-row {
      display: grid;
      gap: 12px;
      flex: 0 0 auto;
    }

    .hud {
      position: relative;
      background: rgba(11, 21, 48, 0.42);
      border: 1px solid var(--gold-dim);
      padding: 22px 24px 24px;
      min-width: 0;
      min-height: 0;
    }
    .hud .c {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--gold);
      border-style: solid;
      pointer-events: none;
    }
    .hud .c.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .hud .c.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .hud .c.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .hud .c.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
      width: 100%;
    }
    .panel-head.bar {
      align-items: center;
      margin: -22px -24px 16px;
      padding: 11px 18px 10px;
      background: rgba(240, 168, 70, 0.10);
      border-bottom: 1px solid rgba(240, 168, 70, 0.32);
      gap: 10px;
    }
    .owner .panel-head.bar { margin: -18px -20px 12px; }
    .panel-head.bar .kicker,
    .panel-head.bar .tag { white-space: nowrap; }
    .panel-head .kicker { font-size: 24px; color: var(--gold); letter-spacing: 0.14em; }
    .panel-head .tag {
      font-family: "IBM Plex Mono", monospace;
      font-size: 22px;
      font-weight: 500;
      color: var(--mute);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .systems { display: flex; flex-direction: column; }
    .clock {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 600;
      font-size: 68px;
      line-height: 0.95;
      letter-spacing: -0.04em;
      text-shadow: 0 0 22px rgba(240, 168, 70, 0.45);
    }
    .main.targets-1 .clock, .main.targets-0 .clock { font-size: 72px; }
    .clock .ampm {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.08em;
      margin-left: 8px;
      color: var(--gold);
    }
    .dow {
      margin-top: 10px;
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .full-date {
      margin-top: 2px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 24px;
      font-weight: 500;
      color: var(--mute);
      letter-spacing: 0.04em;
    }
    .wx-row {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding-top: 16px;
      border-top: 1px solid var(--gold-soft);
    }
    .temp {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 600;
      font-size: 64px;
      line-height: 1;
      letter-spacing: -0.04em;
      text-shadow: 0 0 18px rgba(240, 168, 70, 0.4);
    }
    .wx-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .wx-copy .cond {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .wx-copy .loc {
      font-family: "IBM Plex Mono", monospace;
      font-size: 24px;
      color: var(--mute);
      line-height: 1.25;
      white-space: normal;
    }
    .wx-copy .loc .wx-nowp { display: block; }
    .rain {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding-top: 16px;
    }
    .gauge { width: 140px; height: 140px; position: relative; flex: 0 0 auto; }
    .gauge svg { width: 140px; height: 140px; display: block; }
    .gauge-num {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .gauge-num .v {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 600;
      font-size: 36px;
      line-height: 1;
      letter-spacing: -0.04em;
      text-shadow: 0 0 16px rgba(240, 168, 70, 0.55);
    }
    .rain-meta { text-align: center; }
    .rain-meta .lbl {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .rain-meta .line {
      font-family: "IBM Plex Mono", monospace;
      font-size: 24px;
      font-weight: 500;
      color: var(--white);
      line-height: 1.3;
      white-space: nowrap;
    }
    .rain-meta .line.mute { color: var(--mute); }

    .target {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 22px 22px 24px;
    }
    .target-name {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 56px;
      line-height: 0.95;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin: 6px 0 8px;
      text-shadow: 0 0 28px rgba(240, 168, 70, 0.4);
    }
    .main.targets-1 .target-name { font-size: 84px; }
    .target-from {
      font-family: "IBM Plex Mono", monospace;
      font-size: 28px;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.06em;
    }
    .target-loc, .target-when {
      margin-top: 4px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 24px;
      font-weight: 500;
      color: var(--mute);
      letter-spacing: 0.04em;
    }
    .ring-wrap { margin-top: 14px; width: 228px; height: 228px; position: relative; }
    .main.targets-1 .ring-wrap { width: 280px; height: 280px; margin-top: 22px; }
    .ring-wrap svg { width: 100%; height: 100%; display: block; }
    .ring-ticks {
      transform-origin: 0 0;
      -webkit-animation: ring-spin 48s linear infinite;
      animation: ring-spin 48s linear infinite;
    }
    @-webkit-keyframes ring-spin { from { -webkit-transform: rotate(0deg); } to { -webkit-transform: rotate(360deg); } }
    @keyframes ring-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .ring-core {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .ring-core .days {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 600;
      font-size: 72px;
      line-height: 0.9;
      letter-spacing: -0.05em;
      text-shadow: 0 0 24px rgba(240, 168, 70, 0.55);
    }
    .main.targets-1 .ring-core .days { font-size: 96px; }
    .ring-core .unit {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 4px;
    }
    .ring-core .unit-sub {
      font-family: "IBM Plex Mono", monospace;
      font-size: 20px;
      font-weight: 500;
      color: var(--mute);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .ring-core .status {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 16px rgba(240, 168, 70, 0.55);
      line-height: 1.05;
      padding: 0 10px;
      text-align: center;
      max-width: 72%;
    }
    .ring-core .status .ln { display: block; }
    .empty-target {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .empty-target .msg {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 48px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .target-mini {
      text-align: left;
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .target-mini .target-name { font-size: 32px; margin: 4px 0 2px; text-align: left; }
    .target-mini .target-from, .target-mini .target-loc, .target-mini .target-when { text-align: left; }

    .mission { display: flex; flex-direction: column; }
    .next-addr {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 32px;
      line-height: 1.05;
      margin: 8px 0 6px;
    }
    .next-trade {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 0.04em;
      color: var(--gold);
    }
    .next-meta {
      margin-top: 4px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 24px;
      font-weight: 500;
      color: var(--mute);
    }
    .week-rule { height: 1px; background: var(--gold-soft); margin: 12px 0; }
    .week { display: flex; flex-direction: column; gap: 0; min-height: 0; overflow: hidden; }
    .week-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(240, 168, 70, 0.12);
    }
    .week-row:last-child { border-bottom: 0; }
    .week-row .d {
      font-family: "IBM Plex Mono", monospace;
      font-size: 20px;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.04em;
      white-space: nowrap;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    .week-row .d .tm { display: inline; color: var(--mute); font-size: 20px; margin-top: 0; }
    .week-row .t { font-size: 24px; font-weight: 600; line-height: 1.2; }
    .mission .panel-head .kicker { letter-spacing: 0.12em; }
    .mission .panel-head .tag { white-space: nowrap; }
    .systems .panel-head .tag { white-space: nowrap; }
    .week-row .t span {
      display: block;
      font-family: "IBM Plex Mono", monospace;
      font-size: 19px;
      font-weight: 500;
      color: var(--mute);
      margin-top: 2px;
    }
    .empty { color: var(--mute); font-size: 28px; padding: 8px 0; }

    .today-band {
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
      min-height: 96px;
      padding: 0;
      overflow: hidden;
      border: 2px solid var(--gold);
      background: rgba(240, 168, 70, 0.08);
      -webkit-animation: today-pulse 2.8s ease-in-out infinite;
      animation: today-pulse 2.8s ease-in-out infinite;
    }
    @-webkit-keyframes today-pulse {
      0%, 100% { box-shadow: 0 0 8px rgba(240, 168, 70, 0.25); border-color: #F0A846; }
      50% { box-shadow: 0 0 20px 2px rgba(240, 168, 70, 0.55); border-color: #ffd089; }
    }
    @keyframes today-pulse {
      0%, 100% { box-shadow: 0 0 8px rgba(240, 168, 70, 0.25); border-color: #F0A846; }
      50% { box-shadow: 0 0 20px 2px rgba(240, 168, 70, 0.55); border-color: #ffd089; }
    }
    .today-head {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      background: var(--gold);
      color: var(--void);
      padding: 12px 22px;
      min-width: 168px;
    }
    .today-head .kicker {
      color: var(--void);
      font-size: 26px;
      letter-spacing: 0.16em;
      margin: 0;
      text-shadow: none;
      white-space: nowrap;
    }
    .today-head .tag {
      font-family: "IBM Plex Mono", monospace;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(11, 21, 48, 0.72);
    }
    .today-list {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 12px 28px;
    }
    .today-job { min-width: 0; flex: 1 1 auto; }
    .today-job .addr {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 36px;
      line-height: 1.05;
      letter-spacing: 0.01em;
    }
    .today-job.solo {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px 28px;
    }
    .today-job.solo .addr { font-size: 44px; }
    .today-job .trade {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .today-job .meta {
      font-family: "IBM Plex Mono", monospace;
      font-size: 28px;
      font-weight: 500;
      color: var(--mute);
      letter-spacing: 0.04em;
    }
    .today-empty {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      line-height: 1.1;
      flex: 0 0 auto;
    }
    .today-next {
      min-width: 0;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px 18px;
    }
    .today-next .nxt-kicker {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .today-next .addr {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 32px;
      line-height: 1.05;
    }
    .today-next .trade {
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: var(--gold);
    }
    .today-next .meta {
      font-family: "IBM Plex Mono", monospace;
      font-size: 28px;
      font-weight: 500;
      color: var(--mute);
    }
    .comms {
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
      min-height: 64px;
      padding: 0;
      overflow: hidden;
    }
    .comms[hidden] { display: none !important; }
    .comms .panel-label {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 0 22px;
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--void);
      background: var(--gold);
    }
    .comms-viewport {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .comms-track {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      -webkit-animation: comms-scroll 40s linear infinite;
      animation: comms-scroll 40s linear infinite;
    }
    .comms-set {
      display: inline-flex;
      align-items: center;
      font-size: 28px;
      line-height: 1.2;
      padding: 10px 0;
    }
    .comms-set strong { font-weight: 600; }
    .comms-src {
      display: inline-flex;
      align-items: center;
      background: #F0A846;
      color: #1a2f61;
      font-family: "Barlow Semi Condensed", sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1;
      padding: 5px 10px 6px;
      border-radius: 4px;
      margin-right: 16px;
      white-space: nowrap;
    }
    .comms-sep {
      display: inline-block;
      padding: 0 1.15em;
      color: var(--gold);
      font-weight: 600;
    }
    @-webkit-keyframes comms-scroll {
      from { -webkit-transform: translateX(0); transform: translateX(0); }
      to { -webkit-transform: translateX(-50%); transform: translateX(-50%); }
    }
    @keyframes comms-scroll {
      from { -webkit-transform: translateX(0); transform: translateX(0); }
      to { -webkit-transform: translateX(-50%); transform: translateX(-50%); }
    }

    .foot {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: 24px;
      font-weight: 500;
      color: var(--mute);
      letter-spacing: 0.06em;
    }
    .foot .id { color: var(--gold); letter-spacing: 0.14em; }
  </style>
</head>

  <script>
    const TZ = "America/New_York";
    const REFRESH_MS = 3 * 60 * 1000;
    const WEATHER_MS = 15 * 60 * 1000;
    const STALE_MS = 2 * 60 * 60 * 1000;
    const TICKER_PX_PER_SEC = 130;
    const LICENSE_RE = /\b(?:LIC\.?\s*)?(?:EC|CAC)\d+\b/i;
    const RING_C = 2 * Math.PI * 118;

    let lastData = null;
    let lastUpdatedAt = null;
    let dataLoadError = false;
    let boardConfig = { pursuing: [], targets: [] };
    let lastTickerKey = "";

    function stripPII(text) {
      if (text == null) return "";
      return String(text).trim();
    }

    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null && text !== "") n.textContent = text;
      return n;
    }

    function corners(node) {
      ["tl", "tr", "bl", "br"].forEach((c) => node.append(el("span", "c " + c)));
    }

    function nyParts(d) {
      const fmt = new Intl.DateTimeFormat("en-US", {
        timeZone: TZ,
        weekday: "long", year: "numeric", month: "long", day: "numeric",
        hour: "numeric", minute: "2-digit", hour12: true
      });
      const out = { weekday: "", month: "", day: "", year: "", hour: "", minute: "", dayPeriod: "" };
      for (const p of fmt.formatToParts(d)) {
        if (p.type === "dayPeriod") out.dayPeriod = p.value.toUpperCase();
        else if (p.type in out) out[p.type] = p.value;
      }
      return out;
    }

    function nyISO(d) {
      return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
    }

    function nyWeekdayShort(d) {
      return new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short" }).format(d);
    }

    function monthName(iso) {
      const p = nyParts(isoToNoon(iso));
      return p.month;
    }

    function isoToNoon(iso) {
      const [y, mo, da] = String(iso).split("-").map(Number);
      return new Date(y, mo - 1, da, 12);
    }

    function daysBetweenISO(fromISO, toISO) {
      if (!fromISO || !toISO) return null;
      const a = Date.parse(fromISO + "T12:00:00");
      const b = Date.parse(toISO + "T12:00:00");
      if (isNaN(a) || isNaN(b)) return null;
      return Math.round((b - a) / 86400000);
    }

    function tickClock() {
      const now = new Date();
      const p = nyParts(now);
      const clock = document.getElementById("clock");
      clock.replaceChildren(document.createTextNode(p.hour + ":" + p.minute), el("span", "ampm", p.dayPeriod));
      document.getElementById("dow").textContent = p.weekday;
      document.getElementById("full-date").textContent = p.day + " " + p.month + " " + p.year;
      stampFreshness();
    }

    function scaleBoard() {
      const board = document.getElementById("board");
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      board.style.transform = "scale(" + s + ")";
      board.style.left = Math.round((window.innerWidth - 1920 * s) / 2) + "px";
      board.style.top = Math.round((window.innerHeight - 1080 * s) / 2) + "px";
    }

    function parseDueMs(text) {
      const m = String(text || "").match(/\bdue\b\s+(.+)/i);
      if (!m) return null;
      const d = new Date(m[1].trim().replace(/\bnoon\b/i, "12:00 PM"));
      return isNaN(d.getTime()) ? null : d.getTime();
    }

    function dueISO(ms) {
      if (ms == null) return null;
      return nyISO(new Date(ms));
    }

    function receivedSortKey(dateISO, received) {
      const t = String(received || "").match(/(\d{1,2}):(\d{2})\s*([AP]M)/i);
      let minutes = 0;
      if (t) {
        let h = parseInt(t[1], 10) % 12;
        if (/pm/i.test(t[3])) h += 12;
        minutes = h * 60 + parseInt(t[2], 10);
      }
      return (dateISO || "0000-00-00") + "-" + String(minutes).padStart(4, "0");
    }

    function formatDueLabel(received) {
      const m = String(received || "").match(/\bdue\b\s+(.+)/i);
      if (!m) return stripPII(received);
      let s = m[1].trim();
      s = s.replace(/,\s*\d{4}\b/, ",").replace(/\s+\d{4}\b/, "");
      s = s.replace(/\s+/g, " ").replace(/,\s*/g, ", ").trim();
      s = s.replace(/\s+(noon|\d{1,2}:\d{2}\s*[AP]M)$/i, ", $1");
      return "Due " + s;
    }

    function formatReceivedLabel(dateISO, received) {
      const timeM = String(received || "").match(/(\d{1,2}:\d{2}\s*[AP]M)/i);
      const time = timeM ? timeM[1].replace(/\s+/g, " ").replace(/am/i, "AM").replace(/pm/i, "PM") : "";
      const today = nyISO(new Date());
      if (dateISO && dateISO === today) return time ? "Received today, " + time : "Received today";
      let wd = "";
      if (dateISO) wd = nyWeekdayShort(isoToNoon(dateISO));
      if (!wd) {
        const m = String(received || "").match(/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\b/i);
        if (m) wd = m[1][0].toUpperCase() + m[1].slice(1, 3).toLowerCase();
      }
      const lead = wd && time ? "Received " + wd + ", " + time : (wd ? "Received " + wd : (time ? "Received " + time : "Received"));
      return lead;
    }

    function displayTrade(s) {
      return String(s || "").replace(/[A-Za-z0-9]+/g, (w) => {
        if (/^(HVAC|TUG|EXJ|ITB|HQ|SF|AM|PM)$/i.test(w)) return w.toUpperCase();
        return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
      });
    }

    function prettyName(s) {
      return String(s || "").replace(/\s+-\s+/g, " — ").replace(/\s+/g, " ").trim();
    }

    function parseLooseDate(text) {
      const m = String(text || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (m) return m[3] + "-" + m[1].padStart(2, "0") + "-" + m[2].padStart(2, "0");
      const iso = String(text || "").match(/(\d{4})-(\d{2})-(\d{2})/);
      return iso ? iso[0] : null;
    }

    function shortDateLabel(iso, fallback) {
      if (iso) {
        const [y, mo, da] = iso.split("-").map(Number);
        return nyWeekdayShort(new Date(y, mo - 1, da, 12)) + " " + mo + "/" + da;
      }
      return fallback || "";
    }

    function parseScheduleItem(raw, heading) {
      const title = stripPII(typeof raw === "string" ? raw : (raw && (raw.title || raw.project || raw.name)) || "");
      const detail = stripPII(typeof raw === "string" ? "" : (raw && (raw.detail || raw.notes || raw.who || "")) || "");
      const givenDate = typeof raw === "object" && raw ? (raw.date || raw.when || "") : "";
      const parts = title.split(/\s+[—–]\s+|\s{1,2}-{1,2}\s+/);
      let datePart = "", address = title, trade = "";
      if (parts.length >= 3) {
        datePart = parts[0];
        address = parts.slice(1, -1).join(" — ");
        trade = parts[parts.length - 1];
      } else if (parts.length === 2) {
        if (parseLooseDate(parts[0])) { datePart = parts[0]; address = parts[1]; }
        else { address = parts[0]; trade = parts[1]; }
      }
      const dateISO = parseLooseDate(givenDate) || parseLooseDate(datePart) || parseLooseDate(title);
      return {
        dateISO,
        dateLabel: shortDateLabel(dateISO, datePart),
        address: prettyName(address),
        trade: displayTrade(trade),
        detail,
        heading: stripPII(heading || "")
      };
    }

    function pursuingTokens() {
      return ((boardConfig && boardConfig.pursuing) || [])
        .map((t) => String(t || "").trim().toLowerCase()).filter(Boolean);
    }

    function bidIsPursued(project) {
      const name = String(project || "").toLowerCase();
      return pursuingTokens().some((t) => name.indexOf(t) !== -1);
    }

    function collectBids(data) {
      const raw = (data && (data.newBids || data.bids || data.new_bids)) || [];
      return raw.map((b) => {
        if (!b) return null;
        const project = stripPII(prettyName(b.project || b.name || b.title || ""));
        const from = stripPII(b.from || b.builder || b.company || "");
        const received = stripPII(b.received || b.note || "");
        const dueText = b.due || b.dueDate || b.due_date || b.bidDue || "";
        const dueMs = parseDueMs(dueText) || parseDueMs(received);
        const dateISO = b.date || b.receivedDate || "";
        if (!project) return null;
        return { kind: "bid", project, from, location: "", received, dueMs, dateISO, recency: receivedSortKey(dateISO, received) };
      }).filter(Boolean).filter((b) => bidIsPursued(b.project));
    }

    function sortBids(bids) {
      return bids.slice().sort((a, b) => {
        if (a.dueMs != null && b.dueMs != null) return a.dueMs - b.dueMs;
        if (a.dueMs != null) return -1;
        if (b.dueMs != null) return 1;
        if (a.recency !== b.recency) return a.recency < b.recency ? 1 : -1;
        return 0;
      });
    }

    function collectManualTargets() {
      const list = (boardConfig && boardConfig.targets) || [];
      return list.map((t) => {
        if (!t) return null;

        const project = stripPII(t.title || t.name || t.goal || "");

        const from = stripPII(t.builder || t.from || t.company || t.type || "");
        const location = stripPII(t.location || t.community || t.place || "");
        const type = stripPII(t.type || "Goal");
        const status = stripPII(t.status || "IN PURSUIT") || "IN PURSUIT";
        const dateISO = t.date || t.received || "";
        const dueText = t.due || t.dueDate || t.due_date || "";
        const dueMs = parseDueMs(dueText) || (dueText ? Date.parse(dueText) : null);
        return {
          kind: "manual",
          project, from, location, type, status,
          received: stripPII(t.receivedNote || ""),
          dueMs: dueMs && !isNaN(dueMs) ? dueMs : null,
          dateISO: dateISO || "",
          recency: "0000"
        };
      }).filter(Boolean);
    }

    function ringSVG(frac) {
      const f = Math.max(0, Math.min(1, frac || 0));
      const dash = (f * RING_C).toFixed(1) + " " + RING_C.toFixed(1);
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 280 280");
      svg.setAttribute("aria-hidden", "true");
      svg.innerHTML =
        '<circle cx="140" cy="140" r="118" fill="none" stroke="rgba(240,168,70,0.16)" stroke-width="8"></circle>' +
        (f > 0 ? '<circle cx="140" cy="140" r="118" fill="none" stroke="#F0A846" stroke-width="8" stroke-linecap="butt" stroke-dasharray="' + dash + '" transform="rotate(-90 140 140)" style="filter: drop-shadow(0 0 8px rgba(240,168,70,0.7))"></circle>' : "") +
        '<circle cx="140" cy="140" r="104" fill="none" stroke="rgba(240,168,70,0.22)" stroke-width="1"></circle>' +
        '<g transform="translate(140 140)"><g class="ring-ticks">' +
        Array.from({length: 60}, (_, i) => {
          const a = i * 6;
          const major = i % 5 === 0;
          const y1 = major ? -130 : -125;
          const op = major ? "0.75" : "0.32";
          const sw = major ? "2.2" : "1";
          return '<line x1="0" y1="' + y1 + '" x2="0" y2="-116" stroke="rgba(240,168,70,' + op + ')" stroke-width="' + sw + '" transform="rotate(' + a + ')"></line>';
        }).join("") +
        "</g></g>";
      return svg;
    }


    function appendStatus(core, status) {
      const n = el("div", "status");
      const parts = String(status || "IN PURSUIT").trim().split(/\s+/).filter(Boolean);
      if (parts.length >= 2) {

      } else {
        n.textContent = status || "IN PURSUIT";
      }
      core.append(n);
    }

    function ringForBid(t) {
      const today = nyISO(new Date());
      const wrap = el("div", "ring-wrap");
      const core = el("div", "ring-core");
      if (t.kind === "manual" && t.dueMs == null && !t.dateISO) {
        wrap.append(ringSVG(0.28));
        appendStatus(core, t.status || "IN PURSUIT");
        wrap.append(core);
        return wrap;
      }
      if (t.dueMs != null) {
        const days = daysBetweenISO(today, dueISO(t.dueMs));
        const overdue = days != null && days < 0;
        const n = days == null ? 0 : Math.abs(days);
        wrap.append(ringSVG(overdue ? 0 : Math.min(n, 14) / 14));
        core.append(el("div", "days", String(n)));
        core.append(el("div", "unit", n === 1 ? "Day" : "Days"));
        core.append(el("div", "unit-sub", overdue ? "Overdue" : "Until due"));
        wrap.append(core);
        return wrap;
      }
      if (t.dateISO) {
        const days = Math.max(0, daysBetweenISO(t.dateISO, today) || 0);
        wrap.append(ringSVG(Math.min(days, 7) / 7));
        core.append(el("div", "days", String(days)));
        core.append(el("div", "unit", days === 1 ? "Day" : "Days"));
        core.append(el("div", "unit-sub", "Since received"));
        wrap.append(core);
        return wrap;
      }
      wrap.append(ringSVG(0.28));
      appendStatus(core, t.status || "IN PURSUIT");
      wrap.append(core);
      return wrap;
    }

    function collectSchedule(data) {
      const items = [];
      for (const g of (data && data.toScheduleGroups) || []) {
        for (const raw of (g && g.items) || []) items.push(parseScheduleItem(raw, g.heading));
      }
      for (const raw of (data && data.toSchedule) || []) items.push(parseScheduleItem(raw, ""));

      for (const raw of todayTasks) items.push(parseScheduleItem(raw, ""));
      return items.filter((it) => it.address || it.trade);

    function sharedTag(items) {
      const tags = items.map((it) => (it.detail || "").split("·")[0].trim()).filter(Boolean);

    function itemTime(detail) {

    function itemWho(detail) {

    function fitOverflow(container, itemSelector) {
      [...container.querySelectorAll(":scope > .empty.more")].forEach((n) => n.remove());
      const kids = [...container.children];
      kids.forEach((n) => { n.style.display = ""; });
      let hiddenItems = 0;
      const isItem = (n) => itemSelector ? n.matches(itemSelector) : true;
      const hideOrphanHeaders = () => {
        const nodes = [...container.children];
        for (let i = 0; i < nodes.length; i++) {
          if (!nodes[i].classList.contains("own-day") || nodes[i].style.display === "none") continue;
          let has = false;
          for (let j = i + 1; j < nodes.length; j++) {
            if (nodes[j].classList.contains("own-day") || nodes[j].classList.contains("more")) break;
            if (nodes[j].style.display !== "none") { has = true; break; }
          }
          if (!has) nodes[i].style.display = "none";
        }
      };
      const hideFromEnd = () => {
        const visible = [...container.children].filter((n) => n.style.display !== "none" && !n.classList.contains("more"));
        for (let i = visible.length - 1; i >= 0; i--) {
          const node = visible[i];
          node.style.display = "none";
          if (isItem(node)) hiddenItems++;
          return true;
        }
        return false;
      };
      while (container.scrollHeight > container.clientHeight + 1) {
        if (!hideFromEnd()) break;
      }
      hideOrphanHeaders();
      if (hiddenItems) {
        const n = el("div", "empty more", "+" + hiddenItems + " more");
        container.appendChild(n);
        while (container.scrollHeight > container.clientHeight + 1) {
          if (!hideFromEnd()) break;
          hideOrphanHeaders();
          n.textContent = "+" + hiddenItems + " more";
        }
      }
    }

    function tickerHeadline(n) {

    function domainFromUrl(text) {
      const m = String(text || "").match(/https?:\/\/(?:www\.)?([^\/\s]+)/i);
      if (!m) return "";
      const host = m[1].toLowerCase();
      if (host.indexOf("open-meteo") !== -1) return "Open-Meteo";
      if (host.indexOf("apnews") !== -1 || host === "ap.org") return "AP";
      if (host.indexOf("reuters") !== -1) return "Reuters";
      if (host.indexOf("espn") !== -1) return "ESPN";
      if (host.indexOf("bleacherreport") !== -1) return "Bleacher Report";
      if (host.indexOf("usatoday") !== -1) return "USA Today";
      if (host.indexOf("weather.gov") !== -1 || host.indexOf("noaa") !== -1) return "NWS";
      const labels = host.split(".").filter(function (part) {
        return part !== "www" && part !== "com" && part !== "org" && part !== "net" && part !== "gov" && part !== "edu";
      });
      return labels.length ? labels[0] : host;
    }

    function compactSource(src) {
      const s = String(src || "").replace(/\s+/g, " ").trim();
      if (!s) return "";
      const rules = [
        [/open-?meteo/i, "Open-Meteo"],
        [/national weather service|\bnws\b|weather\.gov/i, "NWS"],
        [/^sharma news/i, "Sharma"],
        [/^federal reserve|\bthe fed\b/i, "Fed"],
        [/office of insurance regulation|\bncci\b/i, "FL OIR"],
        [/^espn\b/i, "ESPN"],
        [/^bleacher report/i, "Bleacher Report"],
        [/associated press|^ap\b/i, "AP"],
        [/reuters/i, "Reuters"],
        [/usa today/i, "USA Today"],
        [/herald-?tribune/i, "Herald-Tribune"],
        [/tampa bay monthly/i, "Tampa Bay Monthly"]
      ];
      for (let i = 0; i < rules.length; i++) {
        if (rules[i][0].test(s)) return rules[i][1];
      }
      let out = s.split("/")[0].split("\u2014")[0].split("\u2013")[0].split(",")[0].trim();
      if (out.length > 22) {
        const clipped = out.slice(0, 22).replace(/\s+\S*$/, "").trim();
        out = clipped || out.slice(0, 22);
      }
      return out;
    }

    function tickerSource(n) {
      const obj = typeof n === "string" ? { headline: n } : (n || {});
      let src = compactSource(obj.source || obj.src || obj.outlet || obj.publisher || obj.byline || obj.attribution || "");
      if (!src) src = compactSource(domainFromUrl(obj.url || obj.href || obj.link || obj.website || obj.sourceUrl || obj.source_url || ""));
      if (!src) src = compactSource(domainFromUrl(obj.headline || obj.title || ""));
      return src || "News";
    }

    function shortHead(text) {
      const t = text.replace(/\s+[—–-]\s+/, " — ");
      const cut = t.split(/\s+[—–]\s+/)[0];
      const words = cut.split(/\s+/);
      if (words.length <= 4) return cut;
      return words.slice(0, 3).join(" ");
    }

    function collectTickerParts(data) {
      const parts = [];
      for (const n of (data && data.news) || []) {
        const headline = tickerHeadline(n);
        if (!headline) continue;
        const lead = shortHead(headline);
        const rest = headline.replace(lead, "").replace(/^\s*[—–-]\s*/, "").trim();
        parts.push({ source: tickerSource(n), strong: lead, rest: rest || headline });
      }
      for (const item of (data && data.ticker) || []) {
        const s = stripPII(typeof item === "string" ? item : (item && (item.text || item.headline || item.message)) || "");
        if (!s || LICENSE_RE.test(s)) continue;
        parts.push({ source: tickerSource(item), strong: "", rest: s });
      }
      return parts;
    }

    function fillTickerSet(set, parts) {
      parts.forEach((p, i) => {
        if (i) set.append(el("span", "comms-sep", "//"));
        set.append(el("span", "comms-src", p.source || "News"));

          set.append(el("strong", "", p.strong));
          set.append(document.createTextNode("\u00a0\u00a0" + p.rest));
        } else {
          set.append(el("strong", "", p.strong || p.rest));
        }
      });
      set.append(el("span", "comms-sep", "//"));
    }

    function renderTicker(data) {

      if (!parts.length) {

      bar.removeAttribute("hidden");
      const key = parts.map((p) => (p.source || "") + "\t" + p.strong + "\t" + p.rest).join("\n");
      if (key === lastTickerKey && viewport.querySelector(".comms-track")) return;
      lastTickerKey = key;

      viewport.replaceChildren(track);
      const apply = function () {
        const w = setA.offsetWidth;
        if (!w) return;
        const secs = Math.max(10, w / TICKER_PX_PER_SEC);
        track.style.webkitAnimationDuration = secs + "s";
        track.style.animationDuration = secs + "s";
      };
      if (window.requestAnimationFrame) window.requestAnimationFrame(function () { window.requestAnimationFrame(apply); });
      else apply();
    }

    function firstTimestamp(data) {
      if (!data || typeof data !== "object") return null;
      for (const k of ["updatedAt", "updated_at", "lastUpdated", "last_updated", "updated"]) {
        if (data[k]) {
          const d = new Date(data[k]);
          if (!isNaN(d.getTime())) return d;
        }
      }
      return null;
    }

    function stampFreshness() {
      const updatedEl = document.getElementById("updated");
      const flag = document.getElementById("flag-stale");
      const ops = document.getElementById("ops");
      if (dataLoadError && !lastUpdatedAt) {
        updatedEl.textContent = "Can't reach data";
        flag.classList.add("on");
        ops.classList.add("stale");
        ops.replaceChildren(document.createTextNode("Ops "), el("span", "sep", "//"), document.createTextNode(" Stale"));
        return;
      }
      if (!lastUpdatedAt) {
        updatedEl.textContent = "Updated —";
        flag.classList.remove("on");
        ops.classList.remove("stale");
        return;
      }
      const p = nyParts(lastUpdatedAt);
      const today = nyISO(new Date());
      const stampDay = nyISO(lastUpdatedAt);
      const time = p.hour + ":" + p.minute + " " + p.dayPeriod;
      updatedEl.textContent = stampDay === today ? "Updated " + time : "Updated " + p.month + " " + p.day + ", " + time;
      const stale = (Date.now() - lastUpdatedAt.getTime()) > STALE_MS;
      flag.classList.toggle("on", stale);
      ops.classList.toggle("stale", stale);
      ops.replaceChildren(
        document.createTextNode("Ops "),
        el("span", "sep", "//"),
        document.createTextNode(stale ? " Stale" : " Live")
      );
    }


    function shiftISO(iso, days) {
      const [y, m, d] = iso.split("-").map(Number);
      const dt = new Date(y, m - 1, d + days, 12);
      return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
    }

    function extractTime(text) {
      const m = String(text || "").match(/\b(\d{1,2}:\d{2}\s*[AP]M)\b/i);
      return m ? m[1].replace(/\s+/g, " ").replace(/am/i, "AM").replace(/pm/i, "PM") : "";
    }

    function timeSortKey(time) {
      const t = String(time || "").match(/(\d{1,2}):(\d{2})\s*([AP]M)/i);
      if (!t) return -1;
      let h = parseInt(t[1], 10) % 12;
      if (/pm/i.test(t[3])) h += 12;
      return h * 60 + parseInt(t[2], 10);
    }

    function normalizeOwnerItem(raw, fallbackDate) {
      if (!raw) return null;
      if (typeof raw === "string") raw = { title: raw };
      const date = parseLooseDate(raw.date || raw.day || "") || fallbackDate || null;
      const title = stripPII(raw.title || raw.name || raw.event || raw.project || "");
      const location = stripPII(raw.location || raw.place || raw.where || raw.address || "");
      const notes = stripPII(raw.notes || raw.note || raw.detail || raw.details || "");
      const phone = stripPII(raw.phone || raw.cell || raw.tel || raw.mobile || "");
      let time = stripPII(raw.time || raw.when || raw.start || "");
      if (!time) time = extractTime(title) || extractTime(notes) || extractTime(location);
      if (!title && !time && !location && !notes && !phone) return null;
      return { date, time, title, location, notes, phone };
    }

    function collectOwnerSchedule(data) {
      const items = [];
      const rawList = data && (data.mySchedule || data.my_schedule || data.ownerSchedule);
      if (Array.isArray(rawList) && rawList.length) {
        for (const raw of rawList) {
          const it = normalizeOwnerItem(raw, null);
          if (it) items.push(it);
        }
      } else {
        const tasks = (data && data.tasks) || {};
        const today = nyISO(new Date());
        for (let i = 0; i <= 2; i++) {
          const d = shiftISO(today, i);
          for (const raw of (tasks[d] || [])) {
            const it = normalizeOwnerItem(raw, d);
            if (it) items.push(it);
          }
        }
      }
      const today = nyISO(new Date());
      const last = shiftISO(today, 2);
      return items
        .filter((it) => it.date && it.date >= today && it.date <= last)
        .sort((a, b) => String(a.date).localeCompare(String(b.date)) || timeSortKey(a.time) - timeSortKey(b.time));
    }

    function renderOwnerItem(it, compact) {
      const row = el("div", compact ? "own-item compact" : "own-item");
      if (it.time) row.append(el("div", "tm", it.time));
      if (it.title) row.append(el("div", "ttl", it.title));
      const bits = compact
        ? [it.location, it.phone].filter(Boolean)
        : [it.location, it.notes, it.phone].filter(Boolean);
      if (bits.length) row.append(el("div", "meta", bits.join(" · ")));
      return row;
    }

    function renderOwnerSchedule(data) {
      const list = document.getElementById("owner-list");
      const tag = document.getElementById("owner-tag");
      const items = collectOwnerSchedule(data);
      list.replaceChildren();
      if (!items.length) {
        if (tag) tag.textContent = "";
        const a = el("div", "awaiting");
        a.append(el("div", "", "Awaiting sync"), el("div", "", "from My Day"));
        list.append(a);
        return;
      }
      const today = nyISO(new Date());
      const byDay = {};
      for (const it of items) {
        (byDay[it.date] || (byDay[it.date] = [])).push(it);
      }
      const days = Object.keys(byDay).sort();
      if (tag) tag.textContent = items.length === 1 ? "1 item" : items.length + " items";
      for (const day of days) {
        const compact = day !== today;
        if (day !== today) list.append(el("div", "own-day", shortDateLabel(day, day)));
        for (const it of byDay[day]) list.append(renderOwnerItem(it, compact));
      }
      const refit = () => { if (document.getElementById("owner-list") === list) fitOverflow(list, ".own-item"); };
      requestAnimationFrame(refit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
    }

    function renderAll(data) {
      lastData = data;
      lastUpdatedAt = firstTimestamp(data);
      renderTargets(data);
      renderSchedule(data);
      renderOwnerSchedule(data);
      renderTicker(data);
      stampFreshness();
    }

    function wmoText(code) {
      const c = Number(code);
      if (c === 0) return "Clear";
      if (c === 1) return "Mostly clear";
      if (c === 2) return "Partly cloudy";
      if (c === 3) return "Cloudy";
      if (c === 45 || c === 48) return "Fog";
      if (c >= 51 && c <= 57) return "Drizzle";
      if (c >= 61 && c <= 67) return "Rain";
      if (c >= 71 && c <= 77) return "Snow";
      if (c >= 80 && c <= 82) return "Showers";
      if (c >= 95) return "Thunderstorms";
      return "Orlando";
    }

    function fmtHour(h) {
      const n = Number(h);
      if (n === 0) return "12 AM";
      if (n === 12) return "12 PM";
      return n > 12 ? (n - 12) + " PM" : n + " AM";
    }

    function rainSummary(hourly, nowHour) {
      const times = (hourly && hourly.time) || [];
      const probs = (hourly && hourly.precipitation_probability) || [];
      const points = [];
      for (let i = 0; i < times.length; i++) {
        const h = Number(String(times[i]).slice(11, 13));
        if (h < nowHour || h > 22) continue;
        points.push({ h, p: Number(probs[i] || 0) });
      }
      if (!points.length) return { peak: 0, line: "", sub: "" };
      const nowP = points[0].p;
      let peak = points[0];
      for (const pt of points) if (pt.p > peak.p) peak = pt;
      const rise = points.find((pt) => pt.h > nowHour && pt.p >= Math.max(40, nowP + 15));
      let line = "Peak " + Math.round(peak.p) + "%";
      let sub = "";
      if (peak.h > nowHour && peak.p >= 40) {
        line = "Peak " + Math.round(peak.p) + "% by " + fmtHour(peak.h);
        if (rise) sub = "Rises after " + fmtHour(rise.h);
      } else if (nowP >= 40) {
        line = Math.round(nowP) + "% rain now";
        sub = "Peak " + Math.round(peak.p) + "% at " + fmtHour(peak.h);
      } else {
        line = "Peak " + Math.round(peak.p) + "%";
        sub = "Rain stays low";
      }
      return { peak: peak.p, line, sub };
    }

    async function loadWeather() {
      try {
        const u = new URL("https://api.open-meteo.com/v1/forecast");
        u.searchParams.set("latitude", "28.5383");
        u.searchParams.set("longitude", "-81.3792");
        u.searchParams.set("current", "temperature_2m,weather_code,precipitation_probability");
        u.searchParams.set("hourly", "precipitation_probability");
        u.searchParams.set("temperature_unit", "fahrenheit");
        u.searchParams.set("timezone", TZ);
        u.searchParams.set("forecast_days", "1");
        const res = await fetch(u.toString());
        const j = await res.json();
        if (!j || !j.current) return;
        document.getElementById("wx-temp").textContent = Math.round(j.current.temperature_2m) + "°";
        document.getElementById("wx-cond").textContent = wmoText(j.current.weather_code);
        const nowP = j.current.precipitation_probability;
        const loc = document.getElementById("wx-loc");
        loc.textContent = nowP != null ? "Orlando · " + Math.round(nowP) + "%" : "Orlando";
        const hour = Number(new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", hourCycle: "h23" }).format(new Date()));
        const rain = rainSummary(j.hourly, hour);
        const rainLine = document.getElementById("rain-line");
        if (rainLine) rainLine.textContent = (rain.line || "").replace(" by ", " · ");
      } catch (e) { /* keep last weather */ }
    }

    async function loadBoardConfig() {
      try {
        const res = await fetch("board-config.json?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) return;
        const cfg = await res.json();
        if (!cfg || typeof cfg !== "object") return;
        boardConfig = {
          pursuing: Array.isArray(cfg.pursuing) ? cfg.pursuing : (boardConfig.pursuing || []),
          targets: Array.isArray(cfg.targets) ? cfg.targets : (boardConfig.targets || [])
        };
      } catch (e) { /* keep last config */ }
    }

    async function loadData() {
      try {
        const dataP = fetch("data.json?t=" + Date.now(), { cache: "no-store" });
        const cfgP = loadBoardConfig();
        const res = await dataP;
        await cfgP;
        if (!res.ok) throw new Error("bad status");
        const data = await res.json();
        dataLoadError = false;
        renderAll(data);
      } catch (e) {
        dataLoadError = !lastData;
        stampFreshness();
      }
    }

    async function requestWake() {
      try {
        if (navigator.wakeLock && document.visibilityState === "visible") {
          await navigator.wakeLock.request("screen");
        }
      } catch (e) { /* ignore */ }
    }

    scaleBoard();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        scaleBoard();
        if (lastData) { renderTargets(lastData); renderSchedule(lastData); renderOwnerSchedule(lastData); }
      });
    }
    window.addEventListener("resize", () => { scaleBoard(); if (lastData) { renderTargets(lastData); renderSchedule(lastData); renderOwnerSchedule(lastData); } });
    tickClock();
    setInterval(tickClock, 1000);
    loadWeather();
    setInterval(loadWeather, WEATHER_MS);
    loadData();
    setInterval(loadData, REFRESH_MS);
    requestWake();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") { requestWake(); loadData(); loadWeather(); }
    });
  </script>
</body>
</html>
